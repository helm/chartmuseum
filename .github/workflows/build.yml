name: build

on:
  push:
    branches:
      - main
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: ghcr.io/helm/chartmuseum
      DOCKER_PLATFORMS: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/386
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Reclaim disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
      - name: Checkout
        uses: actions/checkout@v2
      - name: setup go environment
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: download dependencies
        run: make bootstrap
      - name: run unit tests
        run: make test
      - name: build binaries
        run: make build-cross
      - name: run acceptance tests
        run: sudo pip install --ignore-installed virtualenv && make acceptance
      - name: Prepare
        id: prepare
        run: |
          version=canary
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1
        with:
          platforms: all
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2
        with:
          version: v0.9.1
      - name: Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}
      - name: Docker Login
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker Buildx (build and push)
        id: image
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          metadata_file="$RUNNER_TEMP/chartmuseum-build-metadata.json"
          docker buildx build --no-cache --pull --output type=image,push=true \
            --metadata-file "$metadata_file" --platform "$DOCKER_PLATFORMS" \
            --build-arg "revision=$(git rev-parse --short HEAD)" \
            --tag "$DOCKER_IMAGE:$VERSION" .
          digest=$(jq -er '."containerimage.digest" | strings | select(test("^sha256:[0-9a-f]{64}$"))' "$metadata_file")
          printf 'ref=%s@%s\n' "$DOCKER_IMAGE" "$digest" >> "$GITHUB_OUTPUT"
      - name: Docker Check Manifest
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: docker buildx imagetools inspect "$IMAGE_REF"
      - name: Install Kubernetes SBOM Tool
        uses: puerco/bom-installer@aa0837e37b6965b5fc50adfad0683ec3c0a2c2c4
      - name: Install sigstore cosign
        uses: sigstore/cosign-installer@v3.10.1
      - name: Release artifacts (includes SBOM and signatures)
        id: release-artifacts
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_STORAGE_CONTAINER_NAME: ${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}
          COSIGN_EXPERIMENTAL: "true"
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: SKIP_BUILD=true ./scripts/release-artifacts.sh
      - name: Sign the published images (via GitHub OIDC token)
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: cosign sign --yes "$IMAGE_REF"
      - name: Attach SBOM to published images
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: cosign attach sbom --sbom "_dist/chartmuseum-${VERSION}.spdx" "$IMAGE_REF"
      - name: Clear
        if: always()
        run: |
          rm -f ${HOME}/.docker/config.json
      - name: upload coverage report
        uses: actions/upload-artifact@main
        with:
          name: chartmuseum-coverage-report-${{ github.sha }}
          path: .cover/
        if: always()
      - name: upload acceptance test report
        uses: actions/upload-artifact@main
        with:
          name: chartmuseum-acceptance-report-${{ github.sha }}
          path: .robot/
        if: always()
